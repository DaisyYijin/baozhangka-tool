name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows x86(单文件,XP SP3 ~ Win11 通用) ----------
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          cmd //c "build\\windows_build.bat"
          file dist/BaoZhangKaTool.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\BaoZhangKaTool.exe -DestinationPath baozhangka-tool-windows-xp-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-windows-xp-x86
          path: baozhangka-tool-windows-xp-x86.zip

  # ---------- Linux x86_64(原生) ----------
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config file libgtk-3-dev libxtst-dev
      - name: Build
        run: |
          sh build/linux_build.sh
          file dist/baozhangka-tool
      - name: Package
        run: tar -czf baozhangka-tool-linux-x86_64.tar.gz -C dist baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-x86_64
          path: baozhangka-tool-linux-x86_64.tar.gz

  # ---------- Linux ARM64(原生,官方 ARM runner) ----------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config file libgtk-3-dev libxtst-dev
      - name: Build
        run: |
          sh build/linux_build.sh
          file dist/baozhangka-tool
      - name: Package
        run: tar -czf baozhangka-tool-linux-arm64.tar.gz -C dist baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-arm64
          path: baozhangka-tool-linux-arm64.tar.gz

  # ---------- Linux ARM32/armhf(树莓派 32 位系统,交叉编译) ----------
  linux-armhf:
    runs-on: ubuntu-latest
    continue-on-error: true     # 交叉依赖较脆,失败不影响其它产物
    steps:
      - uses: actions/checkout@v4
      - name: Setup multiarch (armhf)
        run: |
          set -e
          sudo dpkg --add-architecture armhf
          # 兼容 deb822(24.04)与传统 sources.list 两种格式
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Architectures: amd64$/Architectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe" | sudo tee /etc/apt/sources.list.d/armhf.list >/dev/null
          else
            sudo sed -i 's/^deb http/deb [arch=amd64,i386] http/' /etc/apt/sources.list
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe" | sudo tee -a /etc/apt/sources.list >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf pkg-config file \
            libgtk-3-dev:armhf libxtst-dev:armhf
      - name: Build
        run: |
          set -e
          export CC=arm-linux-gnueabihf-gcc
          export PKG_CONFIG_LIBDIR="/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig"
          CFLAGS="-std=c99 -O2 -Wall -Isrc/core -Isrc/gtk $(pkg-config --cflags gtk+-3.0 x11 xtst)"
          LIBS="$(pkg-config --libs gtk+-3.0 x11 xtst) -lm"
          mkdir -p dist
          $CC $CFLAGS -o dist/baozhangka-tool \
            src/core/u8.c src/core/inflate.c src/core/zip.c src/core/sheet.c \
            src/core/engine.c src/core/ac_keys.c src/core/import.c \
            src/gtk/platform_x11.c src/gtk/main.c \
            $LIBS
          file dist/baozhangka-tool
      - name: Package
        run: tar -czf baozhangka-tool-linux-armhf.tar.gz -C dist baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-armhf
          path: baozhangka-tool-linux-armhf.tar.gz

  # ---------- 汇总创建 Release ----------
  release:
    needs: [windows-x86, linux-x86_64, linux-arm64, linux-armhf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -la assets/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.zip
            assets/*.tar.gz
