name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows x86(单文件,XP SP3 ~ Win11 通用) ----------
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          cmd //c "build\\windows_build.bat"
          file dist/BaoZhangKaTool.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\BaoZhangKaTool.exe -DestinationPath baozhangka-tool-windows-xp-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-windows-xp-x86
          path: baozhangka-tool-windows-xp-x86.zip

  # ---------- Linux x86_64(原生) ----------
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config file libgtk-3-dev libxtst-dev
      - name: Build
        run: |
          sh build/linux_build.sh
          file dist/baozhangka-tool
      - name: Package
        run: tar -czf baozhangka-tool-linux-x86_64.tar.gz -C dist baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-x86_64
          path: baozhangka-tool-linux-x86_64.tar.gz

  # ---------- Linux ARM64(原生,官方 ARM runner) ----------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config file libgtk-3-dev libxtst-dev
      - name: Build
        run: |
          sh build/linux_build.sh
          file dist/baozhangka-tool
      - name: Package
        run: tar -czf baozhangka-tool-linux-arm64.tar.gz -C dist baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-arm64
          path: baozhangka-tool-linux-arm64.tar.gz

  # ---------- Linux ARM32/armhf(树莓派 32 位系统,QEMU 原生编译) ----------
  linux-armhf:
    runs-on: ubuntu-latest
    continue-on-error: true     # QEMU 较慢且环境易变,失败不影响其它产物
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v2
        name: Build on armv7
        with:
          arch: armv7
          distro: ubuntu22.04
          dockerRunArgs: |
            --volume "${{ github.workspace }}:/repo"
          run: |
            set -e
            cp -r /repo /src && cd /src
            apt-get update
            apt-get install -y gcc pkg-config file libgtk-3-dev libxtst-dev
            sh build/linux_build.sh
            file dist/baozhangka-tool
            cp baozhangka-tool* /repo/ 2>/dev/null || cp dist/baozhangka-tool /repo/
            cd /repo && tar -czf baozhangka-tool-linux-armhf.tar.gz baozhangka-tool
      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE"
          [ -f baozhangka-tool-linux-armhf.tar.gz ] || tar -czf baozhangka-tool-linux-armhf.tar.gz baozhangka-tool
      - uses: actions/upload-artifact@v4
        with:
          name: baozhangka-tool-linux-armhf
          path: baozhangka-tool-linux-armhf.tar.gz

  # ---------- 汇总创建 Release ----------
  release:
    needs: [windows-x86, linux-x86_64, linux-arm64, linux-armhf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -la assets/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.zip
            assets/*.tar.gz
