name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Linux 零依赖验证(编译 + core 测试 + Xvfb 冒烟) ----------
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libx11-dev libxtst-dev xvfb x11-utils xfonts-base file
      - name: Build
        run: sh build/linux_build.sh
      - name: Verify no GTK/GLib dependencies
        run: |
          ldd dist/click-assistant
          if ldd dist/click-assistant | grep -iE 'gtk|glib|gdk|pango|cairo'; then
            echo "::error::发现 GTK/GLib 残留依赖"
            exit 1
          fi
          echo "依赖检查通过:仅 X11 家族"
      - name: Core unit tests
        run: |
          fail=0
          for t in tests/test_*.c; do
            name=$(basename "$t" .c)
            if [ "$name" = "test_theme" ]; then echo "skip $name (Windows 专属)"; continue; fi
            if gcc -std=gnu99 -O1 -Isrc/core "$t" \
                src/core/u8.c src/core/inflate.c src/core/zip.c src/core/sheet.c \
                src/core/engine.c src/core/ac_keys.c src/core/import.c src/core/findimg.c src/core/xls.c \
                -o "/tmp/$name" 2> "/tmp/$name.err" \
               && "/tmp/$name" > "/tmp/$name.out" 2>&1; then
              echo "PASS $name"
            else
              echo "FAIL $name"
              ls -la "/tmp/$name"* 2>/dev/null || true
              cat -v "/tmp/$name.err" "/tmp/$name.out" 2>/dev/null || true
              echo "---- end $name ----"
              fail=1
            fi
          done
          echo "=== ASan 轮(地址消毒,只检内存错误;容器内 LSan 权限不可靠故关泄漏检测) ==="
          for t in tests/test_*.c; do
            name=$(basename "$t" .c)
            if [ "$name" = "test_theme" ]; then continue; fi
            if gcc -std=gnu99 -O1 -g -fsanitize=address -Isrc/core "$t" \
                src/core/u8.c src/core/inflate.c src/core/zip.c src/core/sheet.c \
                src/core/engine.c src/core/ac_keys.c src/core/import.c src/core/findimg.c src/core/xls.c \
                -o "/tmp/$name.asan" 2> "/tmp/$name.asan.err"; then
              if ASAN_OPTIONS=detect_leaks=0 "/tmp/$name.asan" > "/tmp/$name.asan.out" 2>&1; then
                echo "ASAN PASS $name"
              else
                echo "ASAN RUN FAIL $name (exit=$?)"
                cat -v "/tmp/$name.asan.out" 2>/dev/null || true
                fail=1
              fi
            else
              echo "ASAN BUILD FAIL $name"
              cat -v "/tmp/$name.asan.err" 2>/dev/null || true
              fail=1
            fi
          done
          exit $fail
      - name: Xvfb smoke test (GUI 启动存活)
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 ./dist/click-assistant >/tmp/app.log 2>&1 &
          APP=$!
          sleep 4
          if ! grep -q "entering main loop" /tmp/app.log; then
            echo "FATAL: 未进入主循环(初始化阶段卡住或崩溃)"
            cat /tmp/app.log
            exit 1
          fi
          if kill -0 $APP 2>/dev/null; then
            echo "程序存活 4s OK(已进入主循环)"
            xwininfo -root -children 2>/dev/null | head -15 || true
            kill $APP 2>/dev/null || true
          else
            echo "::error::程序提前退出"
            cat /tmp/app.log || true
            exit 1
          fi

  # ---------- Windows x86(单文件,XP SP3 ~ Win11 通用) ----------
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          cmd //c "build\\windows_build.bat"
          file dist/ClickAssistant.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ClickAssistant.exe -DestinationPath click-assistant-windows-xp-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: click-assistant-windows-xp-x86
          path: click-assistant-windows-xp-x86.zip

  # ---------- Linux x86_64(原生;debian:buster 老 glibc 基线,兼容老发行版) ----------
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in debian:buster (old-glibc baseline)
        run: |
          mkdir -p dist-out
          docker run --rm -v "${{ github.workspace }}:/repo" debian:buster bash -c "
            set -e
            printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
            cp -r /repo /src && cd /src
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq gcc pkg-config file binutils libx11-dev libxtst-dev
            sh build/linux_build.sh
            file dist/click-assistant
            echo '=== glibc symbol versions required (sorted, highest last) ==='
            objdump -T dist/click-assistant | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
            cp dist/click-assistant /repo/dist-out/
          "
      - name: Package
        run: tar -czf click-assistant-linux-x86_64.tar.gz -C dist-out click-assistant
      - uses: actions/upload-artifact@v4
        with:
          name: click-assistant-linux-x86_64
          path: click-assistant-linux-x86_64.tar.gz

  # ---------- Linux ARM64(原生 runner;debian:buster 老 glibc 基线,兼容银河麒麟 V10) ----------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build in debian:buster (old-glibc baseline for Kylin V10)
        run: |
          mkdir -p dist-out
          docker run --rm -v "${{ github.workspace }}:/repo" debian:buster bash -c "
            set -e
            printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
            cp -r /repo /src && cd /src
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq gcc pkg-config file binutils libx11-dev libxtst-dev
            sh build/linux_build.sh
            file dist/click-assistant
            echo '=== glibc symbol versions required (sorted, highest last) ==='
            objdump -T dist/click-assistant | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
            cp dist/click-assistant /repo/dist-out/
          "
      - name: Package
        run: tar -czf click-assistant-linux-arm64.tar.gz -C dist-out click-assistant
      - uses: actions/upload-artifact@v4
        with:
          name: click-assistant-linux-arm64
          path: click-assistant-linux-arm64.tar.gz

  # ---------- Linux ARM32/armhf(树莓派 32 位系统,QEMU 原生编译) ----------
  linux-armhf:
    runs-on: ubuntu-latest
    continue-on-error: true     # QEMU 较慢且环境易变,失败不影响其它产物
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v2
        name: Build on armv7
        with:
          arch: armv7
          distro: ubuntu22.04
          dockerRunArgs: |
            --volume "${{ github.workspace }}:/repo"
          run: |
            set -e
            cp -r /repo /src && cd /src
            apt-get update
            apt-get install -y gcc pkg-config file libxtst-dev
            sh build/linux_build.sh
            file dist/click-assistant
            cp click-assistant* /repo/ 2>/dev/null || cp dist/click-assistant /repo/
            cd /repo && tar -czf click-assistant-linux-armhf.tar.gz click-assistant
      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE"
          [ -f click-assistant-linux-armhf.tar.gz ] || tar -czf click-assistant-linux-armhf.tar.gz click-assistant
      - uses: actions/upload-artifact@v4
        with:
          name: click-assistant-linux-armhf
          path: click-assistant-linux-armhf.tar.gz

  # ---------- 汇总创建 Release ----------
  release:
    needs: [windows-x86, linux-x86_64, linux-arm64, linux-armhf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -la assets/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.zip
            assets/*.tar.gz
